<svg width="250" height="50" viewBox="0 0 250 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  {/* DEFINITIONS FOR GRADIENTS */}
  <defs>
    {/* Left DNA Loop Gradient */}
    <linearGradient id="leftLoopGrad" x1="2" y1="22" x2="37" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#004de6" />
      <stop offset="50%" stopColor="#0088ff" />
      <stop offset="100%" stopColor="#00ccff" />
    </linearGradient>

    {/* Right DNA Loop Gradient */}
    <linearGradient id="rightLoopGrad" x1="37" y1="22" x2="72" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00cc88" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#84cc16" />
    </linearGradient>

    {/* Styled X Text Gradient */}
    <linearGradient id="textGrad" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#00ccff" />
    </linearGradient>
  </defs>

  {/* DNA Icon Group centered vertically */}
  <g transform="translate(2, 3)">
    {/* DNA base pair rungs (Right Loop) */}
    <line x1="47" y1="25" x2="47" y2="19" stroke="#059669" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="47" cy="19" r="1.8" fill="#059669" />
    <line x1="51" y1="26.5" x2="51" y2="17.5" stroke="#10b981" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="51" cy="17.5" r="1.8" fill="#10b981" />
    <line x1="55" y1="28" x2="55" y2="16" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="55" cy="16" r="1.8" fill="#22c55e" />
    <line x1="59" y1="29.5" x2="59" y2="14.5" stroke="#84cc16" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="59" cy="14.5" r="1.8" fill="#84cc16" />

    {/* Medical Plus Cross inside the Right Helix Loop */}
    <path d="M60 22h6M63 19v6" stroke="#059669" strokeWidth="3" strokeLinecap="round" />

    {/* Floating Molecules - Green (Bottom) */}
    <line x1="42" y1="28" x2="42" y2="35" stroke="#22c55e" strokeWidth="1" />
    <line x1="42" y1="35" x2="37" y2="37" stroke="#84cc16" strokeWidth="1" />
    <circle cx="42" cy="28" r="1.8" fill="#10b981" />
    <circle cx="42" cy="35" r="1.5" fill="#22c55e" />
    <circle cx="37" cy="37" r="1.2" fill="#84cc16" />

    {/* Tail node for Green Loop (Top-Right) */}
    <line x1="63" y1="10" x2="68" y2="6" stroke="#84cc16" strokeWidth="1.5" />
    <circle cx="68" cy="6" r="2.5" fill="#84cc16" />

    {/* RIGHT HELIX LOOP */}
    <path
      d="M37 22C46 12 56 10 63 10C70 10 72 15 72 22C72 29 70 34 63 34C56 34 46 32 37 22Z"
      stroke="url(#rightLoopGrad)"
      strokeWidth="4"
      strokeLinecap="round"
      strokeLinejoin="round"
    />

    {/* DNA base pair rungs (Left Loop) */}
    <line x1="11" y1="14" x2="11" y2="30" stroke="#0047cc" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="11" cy="30" r="1.8" fill="#0047cc" />
    <line x1="15" y1="14.5" x2="15" y2="29.5" stroke="#0066e6" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="15" cy="29.5" r="1.8" fill="#0066e6" />
    <line x1="19" y1="16" x2="19" y2="28" stroke="#0088ff" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="19" cy="28" r="1.8" fill="#0088ff" />
    <line x1="23" y1="17.5" x2="23" y2="26.5" stroke="#00aaff" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="23" cy="26.5" r="1.8" fill="#00aaff" />
    <line x1="27" y1="19" x2="27" y2="25" stroke="#00ccff" strokeWidth="2" strokeLinecap="round" opacity="0.8" />
    <circle cx="27" cy="25" r="1.8" fill="#00ccff" />

    {/* Floating Molecules - Blue (Top) */}
    <line x1="32" y1="16" x2="32" y2="9" stroke="#0ea5e9" strokeWidth="1" />
    <line x1="32" y1="9" x2="37" y2="7" stroke="#38bdf8" strokeWidth="1" />
    <circle cx="32" cy="16" r="1.8" fill="#0284c7" />
    <circle cx="32" cy="9" r="1.5" fill="#0ea5e9" />
    <circle cx="37" cy="7" r="1.2" fill="#38bdf8" />

    {/* Tail nodes for Blue Loop (Bottom-Left) */}
    <line x1="11" y1="34" x2="10" y2="39" stroke="#0047cc" strokeWidth="1.5" />
    <line x1="10" y1="39" x2="5" y2="41" stroke="#0033bb" strokeWidth="1.5" />
    <circle cx="10" cy="39" r="2.2" fill="#0047cc" />
    <circle cx="5" cy="41" r="1.8" fill="#0033bb" />

    {/* LEFT HELIX LOOP */}
    <path
      d="M37 22C28 12 18 10 11 10C4 10 2 15 2 22C2 29 4 34 11 34C18 34 28 32 37 22Z"
      stroke="url(#leftLoopGrad)"
      strokeWidth="4"
      strokeLinecap="round"
      strokeLinejoin="round"
    />
  </g>

  {/* Typography Brand Name on the right */}
  <text x="86" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-1">
    <tspan fill="#0C1E36">MEDO</tspan>
    <tspan fill="url(#textGrad)">X</tspan>
  </text>
</svg>