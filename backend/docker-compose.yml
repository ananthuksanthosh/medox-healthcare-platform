services:
  db:
    image: mysql:8.0
    container_name: medox_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: medibee
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medox_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://root:1234@db:3306/medibee
      JWT_SECRET: medibee_super_secret_key
    depends_on:
      db:
        condition: service_healthy
    # Start command: Wait a brief moment, execute prisma db push to sync schema, then launch server
    command: sh -c "npx prisma db push && node server.js"

volumes:
  mysql_data:
    driver: local
