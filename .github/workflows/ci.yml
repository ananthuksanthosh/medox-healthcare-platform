name: MEDOX CI Pipeline

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
frontend-build:
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: frontend

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    run: npm install

  - name: Build Frontend
    run: npm run build
```

backend-build:
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: backend

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Backend Dependencies
    run: npm install

  - name: Validate Backend Project
    run: echo "Backend validation successful"
```
